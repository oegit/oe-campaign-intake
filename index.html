            <div className="hint">Skipping G1 removes the cheap-stills protection — a failed master is then found at video-credit cost (R8).</div>
          </React.Fragment>
        )}
        <div className="grid2">
          <div><label htmlFor="f-duration">Duration (s)</label>
            <input id="f-duration" type="number" min="1" value={s.durationSec} onChange={(e) => up({ durationSec: e.target.value })} placeholder="agent proposes" />
          </div>
          <div><label htmlFor="f-aspect">Aspect ratio</label>
            <select id="f-aspect" value={s.aspectRatio} onChange={(e) => up({ aspectRatio: e.target.value })}>{RATIOS.map((r) => <option key={r} value={r}>{r}</option>)}</select>
          </div>
        </div>
        <label htmlFor="f-format">Output format</label>
        <select id="f-format" value={s.outputFormat} onChange={(e) => up({ outputFormat: e.target.value })}>{OUTPUT_FORMATS.map((f) => <option key={f} value={f}>{f}</option>)}</select>
      </section>

      <section id="s03" className="card">
        <h2><span className="n">03</span> Content</h2>
        <ChipGroup id="g-creation" legend="Assets Creation">
          {CREATION_TYPES.map((t) => <Chip key={t} on={s.creationTypes.includes(t)} onClick={() => up({ creationTypes: toggle(s.creationTypes, t) })}>{t}</Chip>)}
        </ChipGroup>
        {s.creationTypes.length > 0 && (
          <React.Fragment>
            <label htmlFor="f-prompt">What should be generated?</label>
            <textarea id="f-prompt" value={s.creationPrompt} onChange={(e) => up({ creationPrompt: e.target.value })} placeholder="e.g. Real people using the product at home — sofa, laptop, natural light." />
          </React.Fragment>
        )}

        {s.creationTypes.includes("VoiceOver") && (
          <React.Fragment>
            <ChipGroup id="g-vomode" legend="VoiceOver" radio>
              <Chip radio on={s.voMode === "generate"} onClick={() => up({ voMode: "generate" })}>generate</Chip>
              <Chip radio on={s.voMode === "translate"} onClick={() => up({ voMode: "translate" })}>translate (dub)<Pending /></Chip>
            </ChipGroup>
            {s.voMode === "translate" && <div className="hint">⛔ The dub pipeline is specified and <b>inactive</b> (W5). Dub cost is priced <b>per language</b> and is not covered by the per-video ceiling{est.dubbing && est.dubbing.perLanguageCredits != null ? <React.Fragment> — this project records ≈{est.dubbing.perLanguageCredits} cr/language</React.Fragment> : null}.</div>}
            <ChipGroup id="g-volangs" legend="Languages" hint="A pending reviewer language can be selected but stays render-blocked until confirmed (R7 · D2).">
              {cfg.languages.map((l) => (
                <Chip key={l.code} on={s.voLangs.includes(l.code)} onClick={() => up({ voLangs: toggle(s.voLangs, l.code) })}>
                  {l.code} <span className={"badge " + (l.reviewer || "pending")}>{l.reviewer || "pending"}</span>
                </Chip>
              ))}
            </ChipGroup>

            {s.voLangs.length > 0 && (
              <React.Fragment>
                <label htmlFor="f-sheet">Review sheet — delivery is optional, sign-off is not (W6)</label>
                <div className="grid2">
                  <select id="f-sheet" value={s.sheetChannel} onChange={(e) => up({ sheetChannel: e.target.value })}>
                    <option value="">no channel — delivery is manual</option>
                    {SHEET_CHANNELS.map((c) => <option key={c} value={c}>{c}</option>)}
                  </select>
                  <input type="text" aria-label="Review sheet recipient" value={s.sheetRecipient} onChange={(e) => up({ sheetRecipient: e.target.value })} placeholder="channel, doc or address" />
                </div>
                {s.voLangs.map((lang) => (
                  <div key={lang} className="grid2">
                    <input type="text" aria-label={`${lang} — reviewer who signed off`} value={signOffOf(lang).reviewer} onChange={(e) => setSignOff(lang, "reviewer", e.target.value)} placeholder={`${lang} — reviewer who signed off`} />
                    <input type="date" aria-label={`${lang} — date of sign-off`} value={signOffOf(lang).at} onChange={(e) => setSignOff(lang, "at", e.target.value)} />
                  </div>
                ))}
                <div className="hint">The sheet is always generated. Leaving a sign-off empty is honest and blocks that language's render — the D2 gate closes on a recorded sign-off, never on a sheet having been sent.</div>
              </React.Fragment>
            )}
          </React.Fragment>
        )}

        <ChipGroup id="g-upload" legend="Assets Upload" hint="Pick Creation and/or Upload — an intake that creates nothing and uploads nothing has no material to render.">
          {UPLOAD_KINDS.map((k) => <Chip key={k} on={s.uploadKinds.includes(k)} onClick={() => up({ uploadKinds: toggle(s.uploadKinds, k) })}>{k}</Chip>)}
        </ChipGroup>
      </section>

      <section id="s04" className="card">
        <h2><span className="n">04</span> Campaign metadata &amp; delivery</h2>
        <div className="grid2">
          <div><label htmlFor="f-campaign">Campaign name</label><input id="f-campaign" type="text" value={s.campaign} aria-invalid={errors.some((e) => e.field === "f-campaign") ? "true" : undefined} onChange={(e) => up({ campaign: e.target.value })} placeholder="e.g. spring-launch-02" /></div>
          <div><label htmlFor="f-ticket">Ticket number (required)</label><input id="f-ticket" type="text" required value={s.ticketNumber} aria-invalid={errors.some((e) => e.field === "f-ticket") ? "true" : undefined} onChange={(e) => up({ ticketNumber: e.target.value })} placeholder="e.g. ABC-1234" /></div>
        </div>
        <div className="grid2">
          <div><label htmlFor="f-ticketlink">Ticket link</label><input id="f-ticketlink" type="text" value={s.ticketLink} onChange={(e) => up({ ticketLink: e.target.value })} placeholder="optional" /></div>
          <div><label htmlFor="f-deadline">Deadline</label><input id="f-deadline" type="date" value={s.deadline} onChange={(e) => up({ deadline: e.target.value })} /></div>
        </div>
        <label htmlFor="f-utm">UTM</label>
        <input id="f-utm" type="text" value={s.utm} onChange={(e) => up({ utm: e.target.value })} placeholder="optional" />
        <label htmlFor="f-drive">Delivery Drive folder</label>
        <input id="f-drive" type="text" value={s.driveFolder} aria-invalid={errors.some((e) => e.field === "f-drive") ? "true" : undefined} onChange={(e) => up({ driveFolder: e.target.value })} placeholder={cfg.deliveryDriveDefault} />
        <div className="hint">
          Every final file lands in <code>{(s.driveFolder || cfg.deliveryDriveDefault || "<drive>") + "/" + (s.ticketNumber.trim() || "<ticket>") + "/"}</code> —
          the folder <b>is</b> the ticket number (W4), so a delivery traces back to its request without anyone remembering a rule.
        </div>
      </section>

      <section id="s05" className="card">
        <h2><span className="n">05</span> Variations &amp; cost</h2>
        <div className="grid2">
          <div><label htmlFor="f-count">Variations</label><input id="f-count" type="number" min="0" value={s.count} onChange={(e) => up({ count: e.target.value })} /></div>
          <div><label htmlFor="f-est">Estimate, before any credit is spent</label>
            <div className="est" id="f-est">≈ <b>{est.totalCredits}</b> cr — master {est.masterCredits} + {intake.variations.count} × {est.perVariationCredits}</div>
          </div>
        </div>
        <div className="hint">
          USD is <b>not</b> estimated: {est.notCaptured.join(" · ")}.
          {est.budgetUsd != null && <React.Fragment> The project ceiling is ${est.budgetUsd}/video (I1) and cannot be checked against a credit figure — that check happens with a real price, not a guessed one.</React.Fragment>}
        </div>
      </section>

      {totalBlocks > 0 && (
        <section className="card warn-card">
          <h2>{totalBlocks} render block{totalBlocks > 1 ? "s" : ""} — recorded, not refused</h2>
          <p className="hint">
            These are well-formed and worth capturing. The validator will refuse to RENDER them, which
            is a different answer from refusing to record them — asking for something the agent cannot
            build yet is useful information, not a mistake.
          </p>
          {SECTIONS.flatMap((x) => x.block.map((b, i) => <div key={x.n + i} className="hint warn-line">{x.n} · {b}</div>))}
        </section>
      )}

      <section className="card">
        <h2><span className="n">→</span> intake.json</h2>
        <pre tabIndex="0" aria-label="The emitted intake.json">{JSON.stringify(intake, null, 2)}</pre>
        <div className="hint">Then run <code>scripts/intake-validator.js</code> — the Layer-2 cross-checks (reviewer · sign-off · closings · template · ticket) before any credit. A render block there is not a mistake in this form; it is the form having done its job.</div>
      </section>

      {/* The ledger. What this will cost and what it will stop, in view the whole way down. */}
      <div className="ledger">
        <span className={"figure" + (errors.length ? " blocking" : "")}><b>{errors.length}</b> to fix</span>
        <span className="figure"><b>{totalBlocks}</b> render block{totalBlocks === 1 ? "" : "s"}</span>
        <span className="figure">≈ <b>{est.totalCredits}</b> cr{est.budgetUsd != null ? ` · ceiling $${est.budgetUsd}/video` : ""}</span>
        <span className="actions">
          <button type="button" className="btn ghost" onClick={() => navigator.clipboard && navigator.clipboard.writeText(JSON.stringify(intake, null, 2))}>Copy JSON</button>
          <button type="button" className="btn" disabled={errors.length > 0} onClick={download}>Download intake.json</button>
        </span>
      </div>
        </main>
      </div>
    </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
