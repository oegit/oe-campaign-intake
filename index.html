      aria-disabled={disabled ? "true" : undefined}
      onClick={disabled ? (e) => e.preventDefault() : onClick}
    >
      {children}
    </button>
  );
}

/** A labelled group of chips. A row of toggles with no group name is a row of orphans. */
function ChipGroup({ id, legend, hint, radio, children }) {
  return (
    <fieldset id={id}>
      <legend>{legend}</legend>
      <div className="row" role={radio ? "radiogroup" : undefined} aria-label={radio ? legend : undefined}>{children}</div>
      {hint && <div className="hint">{hint}</div>}
    </fieldset>
  );
}
const toggle = (arr, v) => (arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]);

// ── Remembering a config ─────────────────────────────────────────────────────────────────────
//
// sessionStorage by DEFAULT, localStorage only when explicitly ticked. That is not caution for its
// own sake: every GitHub Pages site under one account shares ONE ORIGIN, so a config left in
// localStorage here is readable by script on every other page published under the same account.
// A per-tab copy solves the actual annoyance (reloading and losing it) without that.
//
// Versioned key: a shape change is then ignored rather than half-read. And every access is wrapped,
// because Safari's private mode throws on write and a `file://` page has an opaque origin that can
// throw on READ — and `npm run intake` produces exactly a file:// page. Storage being unavailable
// must degrade to "cannot remember", never to a blank page.
const STORE_KEY = "campaign-intake:config:v1";
const store = {
  read() {
    for (const s of [safeStore(() => sessionStorage), safeStore(() => localStorage)]) {
      try {
        const raw = s && s.getItem(STORE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { /* unreadable is the same as absent */ }
    }
    return null;
  },
  write(entry, persist) {
    const s = safeStore(() => (persist ? localStorage : sessionStorage));
    try { s && s.setItem(STORE_KEY, JSON.stringify(entry)); return !!s; } catch (e) { return false; }
  },
  clear() {
    for (const s of [safeStore(() => sessionStorage), safeStore(() => localStorage)]) {
      try { s && s.removeItem(STORE_KEY); } catch (e) { /* nothing to do */ }
    }
  },
  available() { return !!safeStore(() => sessionStorage); },
};
function safeStore(get) { try { return get(); } catch (e) { return null; } }

/**
 * Turn pasted/dropped text into a usable config, or into a message that says which stage failed.
 * Stages are named because "invalid config" is not actionable and "line 12: expected a comma" is.
 * The last stage is `missingConfigKeys` — the SAME function the fail-closed guard has always used
 * and the same one `open-intake.js` runs server-side. The guard did not get weaker; it moved to
 * the door.
 */
function ingestConfig(text) {
  const raw = String(text || "").trim();
  if (!raw) return { error: "Nothing to read — the file or the box is empty." };
  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch (e) {
    const at = jsonErrorContext(raw, e.message);
    return {
      error: "That is not valid JSON." + (at ? ` Line ${at.line}, column ${at.column}: ${e.message}` : ` ${e.message}`),
      excerpt: at && at.excerpt,
    };
  }
  if (parsed === null || typeof parsed !== "object" || Array.isArray(parsed)) {
    return { error: `A project config is a JSON object; this is ${Array.isArray(parsed) ? "an array" : typeof parsed}.` };
  }
  const missing = missingConfigKeys(parsed);
  if (missing.length) return { cfg: null, missing };
  return { cfg: parsed, warnings: configWarnings(parsed) };
}

/**
 * The empty state — which is now a DOOR, not an error page.
 *
 * Layer 1 ships with no config on purpose (R1) and the guard is fail-closed. On a public URL that
 * same emptiness is the feature: the form is served empty, the config is read in the browser, and
 * nothing project-specific is ever published or uploaded. The CSP is what makes that a guarantee
 * rather than a promise — `connect-src 'none'`, so this page cannot send anywhere what you hand it.
 */
function ConfigLoader({ missing, onLoad }) {
  const [text, setText] = React.useState("");
  const [problem, setProblem] = React.useState(missing ? { missing } : null);
  const [persist, setPersist] = React.useState(false);
  const [dropping, setDropping] = React.useState(false);
  const remembered = store.read();

  function accept(raw, source) {
    const res = ingestConfig(raw);
    if (res.error || (res.missing && res.missing.length)) { setProblem(res); return; }
    setProblem(null);
    store.write({ savedAt: new Date().toISOString(), source, config: res.cfg }, persist);
    onLoad(res.cfg, source, res.warnings || []);
  }

  function takeFile(file) {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => accept(String(r.result), file.name);
    r.onerror = () => setProblem({ error: `Could not read ${file.name}.` });
    r.readAsText(file);
  }

  return (
    <div className="wrap loader">
      <h1>Campaign Intake</h1>
      <div className="sub">
        Video Production agent · this form is <b>Layer 1</b> and ships with no project in it (R1).
        Load a project config to start. <b>It stays in this browser</b> — the page has no way to send
        it anywhere (<code>connect-src 'none'</code>).
      </div>

      <div
        className={"card drop" + (dropping ? " dropping" : "")}
        onDragOver={(e) => { e.preventDefault(); setDropping(true); }}
        onDragLeave={() => setDropping(false)}
        onDrop={(e) => {
          e.preventDefault(); setDropping(false);
          const f = e.dataTransfer.files && e.dataTransfer.files[0];
          if (f) takeFile(f);
          else accept(e.dataTransfer.getData("text/plain"), "dropped text");
        }}
      >
        <h2>Load a Project Config</h2>
        <p className="hint">
          The file is <code>projects/&lt;name&gt;/intake-config.json</code> in the agent's repo. Drop
          it here, choose it, or paste it below.
        </p>
        <div className="row">
          <label className="btn file-btn">
            Choose a file…
            <input type="file" accept="application/json,.json" onChange={(e) => takeFile(e.target.files[0])} />
          </label>
          {remembered && (
            <button type="button" className="btn ghost" onClick={() => accept(JSON.stringify(remembered.config), remembered.source || "remembered")}>
              Use remembered · {(remembered.config && remembered.config.projectLabel) || (remembered.config && remembered.config.project) || "saved config"}
            </button>
          )}
          {remembered && (
            <button type="button" className="btn ghost" onClick={() => { store.clear(); setProblem(null); setText((t) => t); location.reload(); }}>
              Forget it
            </button>
          )}
        </div>

        <label htmlFor="cfg-paste">…or paste the JSON</label>
        <textarea id="cfg-paste" className="mono" value={text} onChange={(e) => setText(e.target.value)} placeholder={'{\n  "project": "…",\n  "channels": { … },\n  "languages": [ … ]\n}'} />
        <div className="row">
          <button type="button" className="btn" onClick={() => accept(text, "pasted")}>Use this config</button>
          <label className="check">
            <input type="checkbox" checked={persist} onChange={(e) => setPersist(e.target.checked)} />
            Remember on this browser
          </label>
        </div>
        <p className="hint">
          {store.available()
            ? persist
              ? "Kept until you clear it — including after you close the browser. Avoid on a shared machine."
              : "Kept for this tab only, and dropped when you close it."
            : "This browser is not letting the page store anything, so the config will not be remembered."}
        </p>
      </div>

      {problem && (
        <div className="card problem" role="alert">
          {problem.missing ? (
            <React.Fragment>
              <h2>Missing Required Keys</h2>
              <p className="hint">This config is missing {problem.missing.length} key{problem.missing.length > 1 ? "s" : ""} the form cannot open without.</p>
              <p className="err">Missing: <code>{problem.missing.join(", ")}</code></p>
              <p className="hint">
                Most of these are read without a fallback, so the form would crash to a blank page
                rather than render — and a blank page is the worst failure available here, because it
                looks like nothing happened. <code>voices</code> and <code>music</code> are the
                exception: this form does not read them, but a config lacking them describes a
                project the validator rejects later anyway.
              </p>
              <p className="hint">All nine: <code>{REQUIRED_CONFIG_KEYS.join(", ")}</code></p>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <h2>Config Could Not Be Read</h2>
              <p className="err">{problem.error}</p>
              {problem.excerpt && <pre className="excerpt">{problem.excerpt}</pre>}
            </React.Fragment>
          )}
        </div>
      )}

      <div className="card">
        <h2>What This Produces</h2>
        <p className="hint">
          A validated <code>campaigns/&lt;name&gt;/intake.json</code> at schemaVersion 2.0, which you
          download and hand to the agent. It is then checked by
          <code> scripts/intake-validator.js</code> — reviewer · sign-off · closings · template ·
          ticket — before any credit is spent. A render block there is not a mistake in this form; it
          is the form having done its job.
        </p>
      </div>
    </div>
  );
}

function BrandBar({ cfg, source, onForget }) {
  const b = cfg.brand || {};
  return (
    <header className="brandbar">
      <div className="wrap">
        <span className="brandmark">
          {b.logo ? <img src={b.logo} alt={b.label || cfg.projectLabel || cfg.project} /> : (b.label || cfg.projectLabel || cfg.project)}
        </span>
        <span className="brandbar-tag">Agent: Video Production · v{FORM_VERSION}</span>
        {/* Which config is driving this form — and ONLY when that is a live question.
            In an injected build there is exactly one project, it is named to the left of this, and
            there is nothing to forget: "config: built in · 4 language(s) · 0 template(s)" was
            answering a question nobody filling in a brief had asked, in the loudest place on the
            page. When the config is LOADED in the browser the question is real (which file did I
            drop? how do I drop another?) and the Forget control has to live somewhere, so it stays
            exactly as it was. */}
        {source && onForget && (
          <span className="brandbar-src">
            config: {source} · {(cfg.languages || []).length} language(s) · {Object.keys(cfg.templates || {}).length} template(s)
            {onForget && <button type="button" className="linkish" onClick={onForget}>Forget</button>}
          </span>
        )}
      </div>
    </header>
  );
}

/** A selection with no pipeline behind it. Shown, never hidden: the request is worth recording. */
const Pending = () => <span className="badge pending" style={{ marginLeft: 6 }}>no pipeline</span>;

/**
 * Owns the active config, and decides what to render. THE ONLY COMPONENT WITH A BRANCH IN IT.
 *
 * Splitting this out is not organisation, it is a bug fix. `App` used to call `useState` before two
 * early returns and `useMemo` after them, so the number of hooks it ran depended on whether a
 * config was present. That was harmless for exactly as long as `PROJECT_CONFIG` was a module
 * constant that could never change — the moment a config can arrive at run time, the same instance
 * renders with two hooks and then three, and React throws "Rendered more hooks than during the
 * previous render". Root has a FIXED hook set and returns a different CHILD; Form has no early
 * return at all.
 */
function Root() {
  // An INJECTED config is the whole session. `npm run intake -- --project X` builds a form for one
  // project, so it must not read storage, offer another config, or show the loader — there is no
  // path here from project B's build to project A's intake.
  const injected = PROJECT_CONFIG && !missingConfigKeys(PROJECT_CONFIG).length;
  const [state, setState] = useState({
    cfg: PROJECT_CONFIG,
    source: PROJECT_CONFIG ? "built in" : null,
    warnings: [],
  });

  // A side effect belongs in an effect. It was in a useMemo, which worked only because its input
  // never changed; with a swappable config the reset has to run on every change, including to null.
  React.useEffect(() => { applyBrand(state.cfg && state.cfg.brand); }, [state.cfg]);

  const missing = state.cfg ? missingConfigKeys(state.cfg) : null;
  if (!state.cfg || missing.length) {
    return (
      <ConfigLoader
        missing={state.cfg ? missing : null}
        onLoad={(cfg, source, warnings) => setState({ cfg, source, warnings })}
      />
    );
  }

  // `key` remounts the form when the config changes. Without it, loading project B after
  // half-filling the form for project A keeps A's template, languages and channels in state, and
  // buildIntakeV2 would happily emit a template B does not own.
  return (
    <Form
      key={state.cfg.project + "|" + state.source}
      cfg={state.cfg}
      source={state.source}
      warnings={state.warnings}
      onForget={injected ? null : () => { store.clear(); setState({ cfg: null, source: null, warnings: [] }); }}
    />
  );
}

/** The form itself. NO EARLY RETURNS HERE — Root has already proved this config is usable. */
function Form({ cfg, source, warnings, onForget }) {
  const [s, set] = useState({
    // Sin tipo de video elegido. Traía "social" precargado, y un radio ya marcado al abrir la
    // sección no es una sugerencia: es una respuesta que el formulario da por la persona y que
    // viaja al documento igual que si la hubiera elegido. Ahora es una tarea pendiente más.
    goal: "", kpis: [], videoTypeKey: "", template: null,
    canal: [], execution: ["Video Assembly"], editing: ["remotion"],
    scriptMode: "Generate", storyboardMode: "Generate", storyboardSkip: "", inspirationMode: "N/A",
    durationSec: "", aspectRatio: "9:16", outputFormat: OUTPUT_FORMATS[0],
    creationTypes: [], creationPrompt: "", voMode: "generate", voLangs: [],
    sheetChannel: "", sheetRecipient: "", signOff: [], uploadKinds: [],
    campaign: "", ticketNumber: "", ticketLink: "", deadline: "", utm: "",
    driveFolder: "", count: 1, compliance: [],
  });
  const up = (patch) => set((prev) => ({ ...prev, ...patch }));

  // One section renders at a time and the rail is its tab control. `visited` is what lets the rail
  // distinguish "this section has no errors" from "a person has been through it" — see SECTIONS.
  const [tab, setTab] = useState("s00");
  const [visited, setVisited] = useState(["s00"]);

  const vt = VIDEO_TYPES.find((t) => t.key === s.videoTypeKey) || null;
  const isSocial = !!vt && vt.key === "social";
  const kpiOptions = vt ? ((cfg.kpis || {})[vt.key] || []) : [];
  const pending = deriveExecutionPending(s.execution, s.editing);
  const errors = formErrors(s, cfg);
  const intake = useMemo(() => buildIntakeV2(s, cfg, new Date().toISOString()), [JSON.stringify(s)]);
  const est = intake.variations.costEstimate;

  // R3: the canal selection derives the format defaults. Derived, and every one editable.
  function toggleCanal(label) {
    const next = toggle(s.canal, label);
    const specKeys = { Meta: ["instagram", "facebook"], TikTok: ["tiktok"], "YouTube Shorts": ["youtube"], LinkedIn: [] }[label] || [];
    const first = next.length ? specKeys[0] || null : null;
    const patch = { canal: next };
    if (first && cfg.channels[first]) {
      patch.aspectRatio = cfg.channels[first].ratios[0] || s.aspectRatio;
    }
    up(patch);
  }

  const setSignOff = (lang, field, value) => {
    const rest = s.signOff.filter((x) => x.lang !== lang);
    const cur = s.signOff.find((x) => x.lang === lang) || { lang, reviewer: "", at: "" };
    up({ signOff: [...rest, { ...cur, [field]: value }] });
  };
  const signOffOf = (lang) => s.signOff.find((x) => x.lang === lang) || { reviewer: "", at: "" };

  const download = () => {
    const blob = new Blob([JSON.stringify(intake, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "intake.json"; a.click();
    // Revoked, which it never was: every download leaked a Blob for the lifetime of the tab, and a
    // form someone fills for ten variations is a form someone clicks this on ten times.
    setTimeout(() => URL.revokeObjectURL(url), 0);
  };

  // ── Submitting (decision X2) ─────────────────────────────────────────────────────────────────
  //
  // `sent` is a small state machine, not a boolean: "sending", "sent" and "failed" are three
  // different things to a person who has just spent twenty minutes filling this in, and collapsing
  // them is how a form loses somebody's work quietly.
  //
  // ON FAILURE THE DOWNLOAD COMES BACK, with the reason attached. Every part of this call is
  // outside our control — a network, a Google deployment, a redirect, an account setting — so the
  // interesting case is not the happy one. A filled form is never lost: the worst outcome is the
  // behaviour this page had yesterday, plus an explanation.
  const [sent, setSent] = useState(null);
  const submit = async () => {
    setSent({ state: "sending" });
    try {
      // `text/plain` on purpose: Apps Script cannot answer a CORS preflight, and a JSON content
      // type is what triggers one. This keeps it a simple request.
      const res = await fetch(SUBMIT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(buildSubmission(intake, SUBMIT_TOKEN)),
      });
      if (!res.ok) throw new Error(`the endpoint answered ${res.status}`);
      const body = await res.json().catch(() => null);
      if (!body || !body.ok) throw new Error((body && body.error) || "the endpoint answered without confirming it stored anything");
      setSent({ state: "sent", file: body.file || null });
    } catch (e) {
      setSent({ state: "failed", why: String((e && e.message) || e) });
    }
  };

  // ── What the rail reports ────────────────────────────────────────────────────────────────────
  //
  // Not progress. BLOCKS. This form's job is to make the expensive discovery — a reviewer nobody
  // assigned, an execution with no pipeline, a type that is phase 2 — happen here, for free, before
  // a credit is spent. So each section reports two counts, and they are different things:
  //   · fix  — the form refuses to export on it. Malformed.
  //   · block — well-formed and correct to record, and the validator will refuse to RENDER it.
  // Conflating the two is the mistake the validator itself is careful not to make.
  //
  // ── WHO THIS LIST IS FOR, AND WHAT THAT COST IT ──────────────────────────────────────────────
  // It reads to somebody in marketing filling in a brief, not to the pipeline. Every entry used to
  // carry the decision code that motivated it (W3, W5, R7 · D2, W6, W4) and the word "render-block",
  // which name a document that reader does not have. Same facts, said in their language.
  //
  // AND THE DELIVERY-FOLDER BLOCK IS GONE FROM HERE — deliberately, not by trimming. It fires on
  // EVERY submission of the published form by design: `deliveryDriveDefault` is published empty
  // because a Drive link is an access grant, and `process-inbox.js` fills it from Layer 2 at
  // ingestion. So the form was telling every single person that their brief had one problem, about
  // a field they cannot see, which the agent resolves without them. It is still a render block and
  // `intake-validator.js` still raises it — this is the FORM's list, not the validator's, and the
  // two answer different questions. A block nobody can act on is noise wearing a warning's clothes.
  const blocksFor = {
    "01": vt && vt.phase ? [`${vt.label}: we record the request, but we do not produce them yet.`] : [],
    "02": pending.length ? [`${pending.join(", ")}: there is no production line behind ${pending.length > 1 ? "these" : "this"} yet.`] : [],
    "03": [
      ...(s.creationTypes.includes("VoiceOver")
        ? s.voLangs
            .filter((code) => reviewerStatusOf(cfg, code) !== "confirmed")
            .map((code) => `Voice-over in ${code}: nobody is assigned to review this language yet.`)
        : []),
      ...(s.creationTypes.includes("VoiceOver")
        ? s.voLangs
            .filter((code) => { const so = signOffOf(code); return !(so.reviewer && so.at); })
            .map((code) => `Voice-over in ${code}: waiting on a native speaker to approve the script.`)
        : []),
      ...(s.voMode === "translate" && s.creationTypes.includes("VoiceOver")
        ? ["Dubbing an existing voice-over into another language is not available yet."]
        : []),
    ],
  };
  // Title Case, all of them — the rail and the section heading show the SAME pair (number, name),
  // so a mix of "Video type" here and "Video Type" there would read as two different things.
  const SECTIONS = [
    { id: "s00", n: "00", name: "Objectives" },
    { id: "s01", n: "01", name: "Video Type" },
    { id: "s02", n: "02", name: "Channel" },
    { id: "s03", n: "03", name: "Content" },
    { id: "s04", n: "04", name: "Metadata & Delivery" },
    { id: "s05", n: "05", name: "Variations & Cost" },
  ].map((x) => ({
    ...x,
    fix: errors.filter((e) => e.section === x.n),
    block: blocksFor[x.n] || [],
    // A section reads DONE only once it has been opened AND has nothing left to fix. Reporting
    // "ok" on a section nobody has looked at is the same error the QA gate makes when it calls a
    // check it never ran a pass: 01 and 05 carry defaults, so on an untouched form they answered
    // "no errors" — which is true, and is not "this person decided this".
    done: visited.includes(x.id) && errors.filter((e) => e.section === x.n).length === 0,
  }));
  const totalBlocks = SECTIONS.reduce((n, x) => n + x.block.length, 0);

  /** Open a section. Marks it visited, so the rail can tell "no errors" from "reviewed". */
  const open = (id) => {
    setTab(id);
    setVisited((v) => (v.includes(id) ? v : v.concat(id)));
  };

  /**
   * Anchors used to only scroll. Now that one section renders at a time, the target may not be
   * mounted at all, so this SWITCHES TAB FIRST and focuses on the next frame — a summary link
   * that scrolls to a section React has not rendered is a link that does nothing.
   */
  const jumpTo = (id) => (e) => {
    e.preventDefault();
    const isSection = /^s\d\d$/.test(id);
    const sectionId = isSection ? id : (SECTIONS.find((x) => errors.some((er) => er.field === id && er.section === x.n)) || {}).id;
    if (sectionId) open(sectionId);
    requestAnimationFrame(() => {
      const el = document.getElementById(id) || (sectionId && document.getElementById(sectionId));
      if (!el) return;
      // Picking a tab is not the same move as chasing a named field, and since one section
      // renders at a time the page is now short enough that a tab needs no scroll at all —
      // scrolling it only produced a jump to a page that was already in view. So a tab returns
      // to the top and a field, which may sit below the fold inside a long section, centres.
      if (isSection) window.scrollTo({ top: 0, behavior: "smooth" });
      else el.scrollIntoView({ block: "center", behavior: "smooth" });
      const focusable = el.matches("input, textarea, select") ? el : el.querySelector("input, textarea, select, button");
      if (focusable) focusable.focus({ preventScroll: true });
    });
  };

  return (
    <React.Fragment>
    <a className="skip" href="#main">Skip to the form</a>
    <BrandBar cfg={cfg} source={source} onForget={onForget} />
    <div className="wrap">
      <h1>Campaign Intake</h1>
      {/* Where the data goes, on the page that sends it — ONE LINE, and it stays.
          The two paragraphs that used to sit here went out because they addressed the wrong reader:
          "produces a validated intake.json at schemaVersion 2.0 (spec §10)" is a note from the
          pipeline to itself, on a form filled in by somebody in marketing. What did NOT go out is
          the destination. A public form that collects answers and does not say where they land is
          worse than one that says it badly, and one sentence is not a paragraph. It still reads
          DIFFERENTLY per build, because the two builds do different things: a page that keeps
          yesterday's promise after gaining a network call is worse than one that never made it. */}
      <div className="sub lede">
        {SUBMIT_ENDPOINT
          ? <React.Fragment>Your brief goes to the Video Production team. Nothing is sent until you press <b>Start Project</b>.</React.Fragment>
          : <React.Fragment>Nothing leaves this browser — this build has no way to send. You finish by downloading the file.</React.Fragment>}
      </div>
      {/* Present-but-empty is not missing, so it never blocks — but a form offering no language at
          all cannot show you a pending reviewer, which is the block this form exists to surface. */}
      {(warnings || []).length > 0 && (
        <div className="card warn-card">
          <h2>Config Loaded, With Gaps</h2>
          <p className="hint">{warnings.length} thing{warnings.length > 1 ? "s are" : " is"} present but empty. Nothing is blocked.</p>
          {warnings.map((w, i) => <div key={i} className="hint warn-line">{w}</div>)}
        </div>
      )}
      {/* This used to say the webfont was blocked "on the published page", which read as: it loads
          here. It does not. `style-src 'self' 'unsafe-inline'` is identical in both builds —
          publish-intake.js rewrites `connect-src` and nothing else — so the request is refused in
          EVERY build, measured: `securitypolicyviolation → style-src-elem → fonts.googleapis.com`.
          The reason it looked like it worked is that the font was installed on the machine doing the
          looking, which is the one condition that makes a font bug invisible to the person shipping
          it. Self-hosting is the only fix, and it is a decision, not a default. */}
      {cfg.brand && cfg.brand.fontsHref && (
        <div className="hint">
          This config asks for a webfont from <code>{(() => { try { return new URL(cfg.brand.fontsHref).host; } catch (e) { return cfg.brand.fontsHref; } })()}</code>,
          and <b>no build loads it</b> — this page reaches no third party for styling, by policy. The
          form uses the font stack the config names, so it looks right only on a machine where that
          font is installed.
        </div>
      )}

      <div className="shell">
        <nav className="rail" aria-label="Sections">
          <ol>
            {SECTIONS.map((x) => (
              <li key={x.id} className={[x.done ? "done" : "pending", tab === x.id ? "current" : ""].filter(Boolean).join(" ")}>
                <a href={"#" + x.id} aria-current={tab === x.id ? "true" : undefined} onClick={jumpTo(x.id)}>
                  <span className="dot" aria-hidden="true"></span>
                  <span>
                    <span className="num">{x.n}</span>
                    <span className="name">{x.name}</span>
                    {/* The state is a WORD as well as a colour — colour alone is not a status (1.4.1). */}
                    <span className="state">
                      {x.fix.length
                        ? `${x.fix.length} to do`
                        : x.block.length
                          ? `${x.block.length} will block render`
                          : x.done ? "done" : "not started"}
                    </span>
                  </span>
                </a>
              </li>
            ))}
          </ol>
        </nav>

        <main id="main">
      {/* Always mounted, empty when clean. A live region that appears at the same instant its text
          changes is frequently not announced at all. Polite, because it re-renders on every
          keystroke and assertive would be a stream of interruptions. */}
      <div className="summary" role="region" aria-live="polite" aria-label="Required tasks">
        {errors.length > 0 && (
          <div className="card problem">
            <h2>Required Tasks</h2>
            <ol>
              {errors.map((e, i) => (
                <li key={i}><a href={"#" + e.field} onClick={jumpTo(e.field)}>{e.section} · {e.message}</a></li>
              ))}
            </ol>
          </div>
        )}
      </div>

      {tab === "s00" && (
      <section id="s00" className="card">
        <h2><span className="n">00</span> Objectives</h2>
        <label htmlFor="f-goal">What is this campaign for, in your own words?</label>
        <textarea id="f-goal" value={s.goal} aria-invalid={errors.some((e) => e.field === "f-goal") ? "true" : undefined} onChange={(e) => up({ goal: e.target.value })} placeholder="e.g. Drive trial sign-ups from lapsed users in our main market." />
        <ChipGroup id="g-kpis" legend={vt ? `KPIs for a ${vt.label.toLowerCase()} video` : "KPIs"} hint="Recorded with your brief. We do not measure them — the work ends at approved files.">
          {kpiOptions.map((k) => <Chip key={k} on={s.kpis.includes(k)} onClick={() => up({ kpis: toggle(s.kpis, k) })}>{k}</Chip>)}
          {!kpiOptions.length && <span className="hint">This project declares no KPIs for this video type.</span>}
        </ChipGroup>
      </section>
      )}

      {tab === "s01" && (
      <section id="s01" className="card">
        <h2><span className="n">01</span> Video Type</h2>
        <ChipGroup id="g-videotype" legend="Type" radio>
          {VIDEO_TYPES.map((t) => (
            <Chip key={t.key} radio on={s.videoTypeKey === t.key} onClick={() => up({ videoTypeKey: t.key, kpis: [], canal: t.key === "social" ? s.canal : [] })}>
              {t.label}{t.phase ? <Pending /> : null}
            </Chip>
          ))}
        </ChipGroup>
        <label htmlFor="f-template">Template</label>
        <select id="f-template" value={s.template || ""} onChange={(e) => up({ template: e.target.value || null })}>
          <option value="">From scratch</option>
          {Object.keys(cfg.templates).map((t) => <option key={t} value={t}>{t}</option>)}
        </select>
        {vt && vt.phase && <div className="hint">You can pick this and we record it — we just do not produce it yet.</div>}
      </section>
      )}

      {tab === "s02" && (
      <section id="s02" className="card">
        <h2><span className="n">02</span> Channel</h2>
        <ChipGroup id="g-execution" legend="Execution — how the video is produced">
          {EXECUTIONS.map((e) => (
            <Chip key={e} on={s.execution.includes(e)} onClick={() => up({ execution: toggle(s.execution, e) })}>
              {e}{IMPLEMENTED_EXECUTIONS.includes(e) ? null : <Pending />}
            </Chip>
          ))}
        </ChipGroup>
        <ChipGroup id="g-editing" legend="Editing tool">
          {EDITING.map((e) => (
            <Chip key={e.value} on={s.editing.includes(e.value)} onClick={() => up({ editing: toggle(s.editing, e.value) })}>
              {e.label}{IMPLEMENTED_EDITING.includes(e.value) ? null : <Pending />}
            </Chip>
          ))}
        </ChipGroup>
        {pending.length > 0 && <div className="hint">⛔ <b>{pending.join(", ")}</b> — recorded, but not produced yet. Today we only make Video Assembly edits.</div>}

        <ChipGroup
          id="g-canal"
          legend={`Channel — where it ships ${isSocial ? "" : "(social only)"}`}
          hint={isSocial
            ? "Picking a channel sets the format defaults below — all editable. 'Meta' covers both Instagram and Facebook."
            : `${vt ? vt.label : "This video type"} has no channel, so we cannot check the layout against a platform's safe area. That is reported as not applicable — never as passed.`}
        >
          {CANAL.map((c) => (
            <Chip key={c} on={s.canal.includes(c)} disabled={!isSocial} title={isSocial ? undefined : `${vt ? vt.label : "No video type picked"} — no channel`} onClick={() => toggleCanal(c)}>{c}</Chip>
          ))}
        </ChipGroup>

        <div className="grid2">
          <div><label htmlFor="f-script">Script</label>
            <select id="f-script" value={s.scriptMode} onChange={(e) => up({ scriptMode: e.target.value })}>{MODES.map((m) => <option key={m} value={m}>{m}</option>)}</select>
          </div>
          <div><label htmlFor="f-storyboard">Storyboard (G1)</label>
            <select id="f-storyboard" value={s.storyboardMode} onChange={(e) => up({ storyboardMode: e.target.value })}>{MODES.map((m) => <option key={m} value={m}>{m}</option>)}</select>
          </div>
        </div>
        {s.storyboardMode === "N/A" && (
          <React.Fragment>
            <label htmlFor="f-skip">Type to confirm skipping G1</label>
            <input id="f-skip" type="text" value={s.storyboardSkip} aria-invalid={errors.some((e) => e.field === "f-skip") ? "true" : undefined} onChange={(e) => up({ storyboardSkip: e.target.value })} placeholder={SKIP_PHRASE} />
            <div className="hint">Skipping the sketches means a look that does not work turns up on a finished video, instead of on a cheap still.</div>
          </React.Fragment>
        )}
        <div className="grid2">
          <div><label htmlFor="f-duration">Duration (s)</label>
            <input id="f-duration" type="number" min="1" value={s.durationSec} onChange={(e) => up({ durationSec: e.target.value })} placeholder="agent proposes" />
          </div>
          <div><label htmlFor="f-aspect">Aspect ratio</label>
            <select id="f-aspect" value={s.aspectRatio} onChange={(e) => up({ aspectRatio: e.target.value })}>{RATIOS.map((r) => <option key={r} value={r}>{r}</option>)}</select>
          </div>
        </div>
        <label htmlFor="f-format">Output format</label>
        <select id="f-format" value={s.outputFormat} onChange={(e) => up({ outputFormat: e.target.value })}>{OUTPUT_FORMATS.map((f) => <option key={f} value={f}>{f}</option>)}</select>
      </section>
      )}

      {tab === "s03" && (
      <section id="s03" className="card">
        <h2><span className="n">03</span> Content</h2>
        <ChipGroup id="g-creation" legend="Assets Creation">
          {CREATION_TYPES.map((t) => <Chip key={t} on={s.creationTypes.includes(t)} onClick={() => up({ creationTypes: toggle(s.creationTypes, t) })}>{t}</Chip>)}
        </ChipGroup>
        {s.creationTypes.length > 0 && (
          <React.Fragment>
            <label htmlFor="f-prompt">What should be generated?</label>
            <textarea id="f-prompt" value={s.creationPrompt} onChange={(e) => up({ creationPrompt: e.target.value })} placeholder="e.g. Real people using the product at home — sofa, laptop, natural light." />
          </React.Fragment>
        )}

        {s.creationTypes.includes("VoiceOver") && (
          <React.Fragment>
            <ChipGroup id="g-vomode" legend="VoiceOver" radio>
              <Chip radio on={s.voMode === "generate"} onClick={() => up({ voMode: "generate" })}>generate</Chip>
              <Chip radio on={s.voMode === "translate"} onClick={() => up({ voMode: "translate" })}>translate (dub)<Pending /></Chip>
            </ChipGroup>
            {s.voMode === "translate" && <div className="hint">⛔ Dubbing is <b>not available yet</b>. It is priced <b>per language</b> and sits outside the per-video ceiling{est.dubbing && est.dubbing.perLanguageCredits != null ? <React.Fragment> — this project records ≈{est.dubbing.perLanguageCredits} cr/language</React.Fragment> : null}.</div>}
            <ChipGroup id="g-volangs" legend="Languages" hint="You can pick a language with no reviewer assigned yet. We record it, and it waits until someone is.">
              {cfg.languages.map((l) => (
                <Chip key={l.code} on={s.voLangs.includes(l.code)} onClick={() => up({ voLangs: toggle(s.voLangs, l.code) })}>
                  {l.code} <span className={"badge " + (l.reviewer || "pending")}>{l.reviewer || "pending"}</span>
                </Chip>
              ))}
            </ChipGroup>

            {s.voLangs.length > 0 && (
              <React.Fragment>
                <label htmlFor="f-sheet">Review sheet — sending it is optional, approval is not</label>
                <div className="grid2">
                  <select id="f-sheet" value={s.sheetChannel} onChange={(e) => up({ sheetChannel: e.target.value })}>
                    <option value="">no channel — delivery is manual</option>
                    {SHEET_CHANNELS.map((c) => <option key={c.value} value={c.value}>{c.label}</option>)}
                  </select>
                  <input type="text" aria-label="Review sheet recipient" value={s.sheetRecipient} onChange={(e) => up({ sheetRecipient: e.target.value })} placeholder="channel, doc or address" />
                </div>
                {s.voLangs.map((lang) => (
                  <div key={lang} className="grid2">
                    <input type="text" aria-label={`${lang} — reviewer who signed off`} value={signOffOf(lang).reviewer} onChange={(e) => setSignOff(lang, "reviewer", e.target.value)} placeholder={`${lang} — reviewer who signed off`} />
                    <input type="date" aria-label={`${lang} — date of sign-off`} value={signOffOf(lang).at} onChange={(e) => setSignOff(lang, "at", e.target.value)} />
                  </div>
                ))}
                <div className="hint">The sheet is always generated. Leaving a sign-off empty is honest and blocks that language's render — the D2 gate closes on a recorded sign-off, never on a sheet having been sent.</div>
              </React.Fragment>
            )}
          </React.Fragment>
        )}

        <ChipGroup id="g-upload" legend="Assets Upload" hint="Pick Creation and/or Upload — a brief that creates nothing and uploads nothing leaves us nothing to work with.">
          {UPLOAD_KINDS.map((k) => <Chip key={k.value} on={s.uploadKinds.includes(k.value)} onClick={() => up({ uploadKinds: toggle(s.uploadKinds, k.value) })}>{k.label}</Chip>)}
        </ChipGroup>
      </section>
      )}

      {tab === "s04" && (
      <section id="s04" className="card">
        <h2><span className="n">04</span> Campaign Metadata &amp; Delivery</h2>
        <div className="grid2">
          <div><label htmlFor="f-campaign">Campaign name</label><input id="f-campaign" type="text" value={s.campaign} aria-invalid={errors.some((e) => e.field === "f-campaign") ? "true" : undefined} onChange={(e) => up({ campaign: e.target.value })} placeholder="e.g. spring-launch-02" /></div>
          <div><label htmlFor="f-ticket">Ticket number (required)</label><input id="f-ticket" type="text" required value={s.ticketNumber} aria-invalid={errors.some((e) => e.field === "f-ticket") ? "true" : undefined} onChange={(e) => up({ ticketNumber: e.target.value })} placeholder="e.g. ABC-1234" /></div>
        </div>
        <div className="grid2">
          <div><label htmlFor="f-ticketlink">Ticket link</label><input id="f-ticketlink" type="text" value={s.ticketLink} onChange={(e) => up({ ticketLink: e.target.value })} placeholder="optional" /></div>
          <div><label htmlFor="f-deadline">Deadline</label><input id="f-deadline" type="date" value={s.deadline} onChange={(e) => up({ deadline: e.target.value })} /></div>
        </div>
        <label htmlFor="f-utm">UTM</label>
        <input id="f-utm" type="text" value={s.utm} onChange={(e) => up({ utm: e.target.value })} placeholder="optional" />
        <label htmlFor="f-drive">Delivery Drive folder</label>
        <input id="f-drive" type="text" value={s.driveFolder} onChange={(e) => up({ driveFolder: e.target.value })} placeholder={cfg.deliveryDriveDefault || "leave blank — the agent fills this in"} />
        <div className="hint">
          Every final file lands in <code>{(s.driveFolder || cfg.deliveryDriveDefault || "<drive>") + "/" + (s.ticketNumber.trim() || "<ticket>") + "/"}</code> —
          the folder <b>is</b> the ticket number, so a delivery traces back to its request without anyone remembering a rule.
        </div>
        {deliveryUnassigned(s, cfg) && (
          <div className="hint">
            <b>Leave this blank if you do not know it.</b> This form is published without the project's
            Drive folder in it on purpose — a Drive link is an access grant, and a public page carrying
            one hands that access to whoever opens it. The agent fills the folder from the project
            config when it takes the intake in, and until then the run is blocked rather than
            delivered somewhere nobody chose.
          </div>
        )}
      </section>
      )}

      {tab === "s05" && (
      <section id="s05" className="card">
        <h2><span className="n">05</span> Variations &amp; Cost</h2>
        <div className="grid2">
          <div><label htmlFor="f-count">Variations</label><input id="f-count" type="number" min="0" value={s.count} onChange={(e) => up({ count: e.target.value })} /></div>
          <div><label htmlFor="f-est">Estimate, before any credit is spent</label>
            <div className="est" id="f-est">≈ <b>{est.totalCredits}</b> cr — master {est.masterCredits} + {intake.variations.count} × {est.perVariationCredits}</div>
          </div>
        </div>
        <div className="hint">
          USD is <b>not</b> estimated: {est.notCaptured.join(" · ")}.
          {est.budgetUsd != null && <React.Fragment> The project ceiling is ${est.budgetUsd}/video and cannot be checked against a credit figure — that check happens with a real price, not a guessed one.</React.Fragment>}
        </div>
      </section>
      )}

      {totalBlocks > 0 && (
        <section className="card warn-card">
          <h2>What We Cannot Make Yet</h2>
          <p className="hint">
            Send this anyway. We record what you asked for — these parts just will not be produced
            until we can make them, and asking is how they get built.
          </p>
          {SECTIONS.flatMap((x) => x.block.map((b, i) => <div key={x.n + i} className="hint warn-line">{b}</div>))}
        </section>
      )}

      {/* El documento emitido, y SÓLO donde alguien va a hacer algo con él.
          En un build con endpoint la persona presiona Start Project y el JSON viaja solo: mostrarle
          200 líneas que no tiene que leer, copiar ni guardar no le da una decisión, le da ruido en
          la sección más larga de la página. Donde NO hay endpoint el panel es la salida real — se
          termina descargando el archivo — así que ahí se queda tal cual, junto al botón que lo baja.
          El botón «Copy JSON» sigue en el ledger en los dos casos: copiar el documento es una acción
          que alguien puede querer; leerlo mientras llena el formulario no lo es. */}
      {!SUBMIT_ENDPOINT && (
        <section className="card">
          <h2><span className="n">→</span> intake.json</h2>
          <pre tabIndex="0" aria-label="The emitted intake.json">{JSON.stringify(intake, null, 2)}</pre>
          <div className="hint">This is the brief your answers produce. It is the file the Download button writes.</div>
        </section>
      )}

      {/* The ledger. What this will cost and what it will stop, in view the whole way down. */}
      <div className="ledger">
        <span className={"figure" + (errors.length ? " blocking" : "")}><b>{errors.length}</b> to do</span>
        <span className="figure"><b>{totalBlocks}</b> not possible yet</span>
        <span className="figure">≈ <b>{est.totalCredits}</b> cr{est.budgetUsd != null ? ` · ceiling $${est.budgetUsd}/video` : ""}</span>
        <span className="actions">
          <button type="button" className="btn ghost" onClick={() => navigator.clipboard && navigator.clipboard.writeText(JSON.stringify(intake, null, 2))}>Copy JSON</button>
          {/* The download is always here when there is no endpoint, and comes BACK when a send
              fails. It is never the thing that disappears. */}
          {(!SUBMIT_ENDPOINT || (sent && sent.state === "failed")) && (
            <button type="button" className="btn" disabled={errors.length > 0} onClick={download}>Download intake.json</button>
          )}
          {SUBMIT_ENDPOINT && (sent && sent.state === "sent"
            ? <span className="figure">✅ sent{sent.file ? ` · ${sent.file}` : ""}</span>
            : <button type="button" className="btn" disabled={errors.length > 0 || (sent && sent.state === "sending")} onClick={submit}>
                {sent && sent.state === "sending" ? "Sending…" : sent && sent.state === "failed" ? "Try sending again" : "Start Project"}
              </button>)}
        </span>
      </div>

      {SUBMIT_ENDPOINT && sent && sent.state === "failed" && (
        <section className="card problem" role="alert">
          <h2>Not Sent — Nothing Is Lost</h2>
          <p className="err">{sent.why}</p>
          <p className="hint">
            Use <b>Download intake.json</b> instead and send the file to whoever runs the agent. The
            form is unchanged and you can try again; the download and the submission carry exactly
            the same document.
          </p>
        </section>
      )}
        </main>
      </div>
    </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
